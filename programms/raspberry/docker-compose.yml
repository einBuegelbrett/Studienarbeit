services:
  cassandra:
    image: cassandra:latest
    container_name: cassandra-service
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - studienarbeit-docker

  cassandra-init:
    build: cassandradb/init-service
    container_name: init-cassandra
    depends_on:
      - cassandra
    volumes:
      - ./cassandradb:/app
    networks:
      - studienarbeit-docker

  bluetooth-reader:
    build:
      context: bluetooth-communication
      dockerfile: Dockerfile
    container_name: bluetooth-reader
    depends_on:
      - cassandra
    network_mode: "host"  
    privileged: true      

networks:
  studienarbeit-docker:

volumes:
  cassandra_data:
